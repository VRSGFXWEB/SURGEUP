
name: Build SurgeUp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Check Android Project
        run: |
          if [ ! -f "settings.gradle.kts" ] || [ ! -d "app" ]; then
            echo "Project Android tidak ditemukan di root!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan!"
            exit 1
          fi

          mkdir -p release-apk
          cp "$APK" release-apk/SurgeUp-debug.apk

          echo "APK berhasil dibuat!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SurgeUp-APK
          path: release-apk/SurgeUp-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release-apk/SurgeUp-debug.apk

          if git diff --cached --quiet; then
            echo "APK tidak berubah."
          else
            git commit -m "Update SurgeUp APK"
            git push
          fi
